name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-typecheck:
    name: Backend — lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: .venv/bin/python -m ruff check src/
      - name: Format check
        working-directory: backend
        run: .venv/bin/python -m ruff format --check src/
      - name: Typecheck
        working-directory: backend
        run: .venv/bin/python -m mypy src/fetch/

  backend-unit-tests:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Unit tests
        working-directory: backend
        env:
          APP_SECRET_KEY: test-secret-key
          LLM_API_KEY: test
          EMBEDDINGS_API_KEY: test
          RERANKER_API_KEY: test
        run: |
          PYTHONPATH=src .venv/bin/python -m pytest tests/unit/ tests/security/ -x -q

  frontend-build:
    name: Frontend — type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker — build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker compose -f infra/compose.yaml build api
